name: Kabar update ke Discord
on:
  push:
    branches: [main]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Kirim webhook
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          [ -n "$HOOK" ] || { echo "Secret DISCORD_WEBHOOK belum diisi"; exit 0; }
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || ls -R)
          lines=""
          for ch in beta stable; do
            label=$([ $ch = beta ] && echo "🧪 BETA" || echo "✅ RILIS")
            if echo "$changed" | grep -q "^$ch/info.txt"; then
              v=$(cut -d'|' -f2 $ch/info.txt); lines="$lines\n$label · Script v$v"
            fi
            if echo "$changed" | grep -q "^$ch/apk.txt"; then
              v=$(cut -d'|' -f3 $ch/apk.txt); lines="$lines\n$label · Aplikasi v$v (pencet Install di aplikasi)"
            fi
          done
          [ -n "$lines" ] || exit 0
          note=$(printf '%s' "$MSG" | grep -v -e '^Co-Authored-By' -e '^Claude-Session' | sed '/^$/d' | head -8)
          body=$(printf "%b\n\n%s\n\nMatikan & nyalakan proxy untuk pakai versi baru." "$lines" "$note")
          jq -n --arg d "$body" '{username:"Emerald Proxy", embeds:[{title:"Update Emerald Proxy", description:$d, color:3462041}]}' \
            | curl -sS -H "Content-Type: application/json" -d @- "$HOOK"
